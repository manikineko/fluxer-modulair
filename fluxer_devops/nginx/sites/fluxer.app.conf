# Gateway domain configuration for fluxer.app
# Copy this to /etc/nginx/sites-available/fluxer.app
# Then symlink: ln -s /etc/nginx/sites-available/fluxer.app /etc/nginx/sites-enabled/

upstream fluxer_gateway {
    server 127.0.0.1:49107;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name fluxer.app;

    # Redirect to HTTPS in production
    # HTTP only for development

        location / {
        proxy_pass http://fluxer_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fluxer.app;

    # SSL configuration (add your cert paths)
    # ssl_certificate /etc/ssl/certs/fluxer.app.crt;
    # ssl_certificate_key /etc/ssl/private/fluxer.app.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://fluxer_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
