apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: fluxer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        image: nats:2.10.25-alpine
        ports:
        - containerPort: 4222
        - containerPort: 4223
        command: ["-js"]
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: fluxer
spec:
  selector:
    app: nats
  ports:
  - protocol: TCP
    port: 4222
    targetPort: 4222
  - protocol: TCP
    port: 4223
    targetPort: 4223
  type: ClusterIP
