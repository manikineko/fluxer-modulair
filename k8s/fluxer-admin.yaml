apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxer-admin
  namespace: fluxer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluxer-admin
  template:
    metadata:
      labels:
        app: fluxer-admin
    spec:
      containers:
      - name: fluxer-admin
        image: ${FLUXER_ADMIN_IMAGE:-ghcr.io/fluxerapp/fluxer-admin:stable}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: FLUXER_CONFIG
          value: "/usr/src/app/config/admin-config.json"
        - name: LOG_LEVEL
          value: "debug"
        - name: FLUXER_ADMIN_PORT
          value: "8081"
        - name: FLUXER_CONFIG__INTERNAL__KV
          value: "redis://valkey:6379/0"
        - name: FLUXER_ADMIN_REDIRECT_URL
          value: "http://localhost:8081"
        - name: FLUXER_STATIC_CDN
          value: "http://fluxer-app-proxy:80"
        - name: OAUTH_CLIENT_ID
          value: "1234567890123456789"
        - name: OAUTH_CLIENT_SECRET
          value: "dev-oauth-client-secret"
        - name: OAUTH_REDIRECT_URI
          value: "http://localhost:8081/oauth2_callback"
        volumeMounts:
        - name: config
          mountPath: /usr/src/app/config
          readOnly: true
        - name: fluxer-static
          mountPath: /usr/src/app/fluxer_static
          readOnly: true
        - name: fluxer-static-admin
          mountPath: /usr/src/app/fluxer_admin/public/static
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: fluxer-config
      - name: fluxer-static
        emptyDir: {}
      - name: fluxer-static-admin
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fluxer-admin
  namespace: fluxer
spec:
  selector:
    app: fluxer-admin
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001
  type: LoadBalancer
