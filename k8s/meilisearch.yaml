apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: fluxer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
      - name: meilisearch
        image: getmeili/meilisearch:v1.14
        ports:
        - containerPort: 7700
        env:
        - name: MEILI_ENV
          value: production
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: meilisearch-secret
              key: master-key
        - name: MEILI_DB_PATH
          value: /meili_data
        - name: MEILI_HTTP_ADDR
          value: 0.0.0.0:7700
        volumeMounts:
        - name: meilisearch-data
          mountPath: /meili_data
        livenessProbe:
          httpGet:
            path: /health
            port: 7700
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: meilisearch-data
        persistentVolumeClaim:
          claimName: meilisearch-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: fluxer
spec:
  selector:
    app: meilisearch
  ports:
  - protocol: TCP
    port: 7700
    targetPort: 7700
  type: ClusterIP
