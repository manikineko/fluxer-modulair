apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipfs
  namespace: fluxer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ipfs
  template:
    metadata:
      labels:
        app: ipfs
    spec:
      containers:
      - name: ipfs
        image: ipfs/kubo:latest
        ports:
        - containerPort: 4001
        - containerPort: 5001
        - containerPort: 8080
        env:
        - name: IPFS_PROFILE
          value: server
        volumeMounts:
        - name: ipfs-data
          mountPath: /data/ipfs
        livenessProbe:
          exec:
            command:
            - ipfs
            - swarm
            - peers
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 20
          failureThreshold: 3
      volumes:
      - name: ipfs-data
        persistentVolumeClaim:
          claimName: ipfs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ipfs
  namespace: fluxer
spec:
  selector:
    app: ipfs
  ports:
  - protocol: TCP
    port: 4001
    targetPort: 4001
  - protocol: TCP
    port: 5001
    targetPort: 5001
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
