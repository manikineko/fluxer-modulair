apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-service
  namespace: fluxer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plugin-service
  template:
    metadata:
      labels:
        app: plugin-service
    spec:
      containers:
      - name: plugin-service
        image: fluxer/plugin-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: FLUXER_PLUGIN_DIR
          value: "/app/plugins"
        - name: FLUXER_PLUGIN_AUTOLOAD
          value: "true"
        - name: FLUXER_PLUGIN_HOT_RELOAD
          value: "false"
        volumeMounts:
        - name: plugins
          mountPath: /app/plugins
      volumes:
      - name: plugins
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-service
  namespace: fluxer
spec:
  selector:
    app: plugin-service
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001
  type: ClusterIP
